name: Build Docker & fnos fpk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-fpk:
    needs: build-docker
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download fnpack
        run: |
          curl -sL "https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64" -o /usr/local/bin/fnpack
          chmod +x /usr/local/bin/fnpack

      - name: Install dependencies
        run: |
          cd server
          npm ci --only=production
          cd ../client
          npm ci

      - name: Build frontend
        run: |
          cd client
          npm run build

      - name: Prepare fpk package
        run: |
          # 创建构建目录
          mkdir -p fpk-build/app/server fpk-build/app/client
          
          # 复制项目文件
          cp -r fnos-native/* fpk-build/
          
          # 复制已构建的文件
          cp -r server/* fpk-build/app/server/
          cp -r server/node_modules fpk-build/app/server/
          cp -r client/* fpk-build/app/client/
          cp -r client/dist fpk-build/app/client/
          cp -r client/node_modules fpk-build/app/client/
          
          # 复制图标
          cp fnos/icon.png fpk-build/ICON.PNG
          cp fnos/icon_256.png fpk-build/ICON_256.PNG
          cp fnos/icon.png fpk-build/app/ui/images/icon_64.png
          cp fnos/icon_256.png fpk-build/app/ui/images/icon_256.png
          
          # 更新版本号
          sed -i "s/^version.*/version               = ${{ steps.version.outputs.version }}/" fpk-build/manifest
          
          # 简化install脚本
          cat > fpk-build/cmd/install_callback << 'EOF'
          #!/bin/bash
          mkdir -p "${TRIM_PKGVAR}/data" "${TRIM_PKGVAR}/logs"
          JWT_SECRET=$(openssl rand -hex 32)
          ENCRYPTION_KEY=$(openssl rand -hex 16)
          cat > "${TRIM_PKGVAR}/.env" << ENVEOF
          PORT=3000
          JWT_SECRET=${JWT_SECRET}
          ENCRYPTION_KEY=${ENCRYPTION_KEY}
          DB_PATH=${TRIM_PKGVAR}/data/newmail.db
          LOG_PATH=${TRIM_PKGVAR}/logs
          NODE_ENV=production
          ENVEOF
          echo "NewMail installed successfully"
          EOF
          chmod +x fpk-build/cmd/*

      - name: Build fpk
        run: |
          cd fpk-build
          fnpack build
          mv newmail.fpk ../newmail_${{ steps.version.outputs.version }}_native.fpk

      - name: Upload fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: newmail-fpk-native
          path: newmail_*_native.fpk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            newmail_*_native.fpk
          generate_release_notes: true
