name: Build Docker & fnos fpk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-arm64-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build ARM64 native module
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v ${{ github.workspace }}/server:/app \
            -w /app \
            node:20-slim \
            bash -c "
              apt-get update > /dev/null 2>&1 && 
              apt-get install -y python3 make g++ > /dev/null 2>&1 &&
              npm install better-sqlite3 --build-from-source > /dev/null 2>&1 &&
              echo 'ARM64 build complete'
            "

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: arm64-binary
          path: server/node_modules/better-sqlite3/build/Release/better_sqlite3.node

  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-fpk:
    needs: build-arm64-native
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: arm64-binary
          path: server/node_modules/better-sqlite3/build/Release/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download fnpack
        run: |
          curl -sL "https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64" -o /usr/local/bin/fnpack
          chmod +x /usr/local/bin/fnpack

      - name: Install dependencies
        run: |
          cd server
          npm install --production --ignore-scripts
          cd ../client
          npm install

      - name: Build frontend
        run: |
          cd client
          npm run build

      - name: Prepare fpk package
        run: |
          # 创建构建目录
          mkdir -p fpk-build/app/server fpk-build/app/ui/images
          
          # 复制项目文件
          cp -r fnos-native/* fpk-build/
          
          # 复制server（包含预编译的ARM64模块）
          cp -r server/* fpk-build/app/server/
          
          # 复制前端构建产物
          mkdir -p fpk-build/app/server/public
          cp -r client/dist/* fpk-build/app/server/public/
          
          # 复制UI配置
          cp fnos-native/app/ui/config fpk-build/app/ui/
          
          # 复制图标
          cp fnos/icon.png fpk-build/ICON.PNG
          cp fnos/icon_256.png fpk-build/ICON_256.PNG
          cp fnos/icon.png fpk-build/app/ui/images/icon_64.png
          cp fnos/icon_256.png fpk-build/app/ui/images/icon_256.png
          
          # 更新版本号
          sed -i "s/^version.*/version               = ${{ steps.version.outputs.version }}/" fpk-build/manifest

      - name: Build fpk
        run: |
          cd fpk-build
          fnpack build
          mv newmail.fpk ../newmail_${{ steps.version.outputs.version }}_native.fpk

      - name: Upload fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: newmail-fpk-native
          path: newmail_*_native.fpk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            newmail_*_native.fpk
          generate_release_notes: true
